# Pulumi IaC: deploy GCP resources (e2-micro VM, firewall, static IP) via Workload Identity Federation.
# No long-lived GCP keys; state in GCS. See README and docs/ for setup.
# Uses official Pulumi GitHub Action: https://www.pulumi.com/docs/iac/guides/continuous-delivery/github-actions/

name: Pulumi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || 'projects/853352203266/locations/global/workloadIdentityPools/github-pool/providers/github-oidc-provider' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-actions@coopstools-homebrew-prj.iam.gserviceaccount.com' }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: infra/go.sum

      - name: Restore Go dependencies
        working-directory: infra
        run: go mod download

      - name: Pulumi Refresh
        uses: pulumi/actions@v6
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_ACTUAL_PASSPHRASE }}
        with:
          command: refresh
          work-dir: infra
          stack-name: ${{ github.ref_name }}
          cloud-url: gs://coopstools-homebrew-prj-pulumi-state

      - name: Pulumi Up
        uses: pulumi/actions@v6
        env:
        # These values are misnamed in GitHub and should be updated later
          # PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }} #<- not needed because we use the GCS backend (note cloud url is set in the "with")
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_ACTUAL_PASSPHRASE }}
        with:
          command: up
          upsert: true # create the stack if it doesn't exist - should be removed after first push
          work-dir: infra
          stack-name: ${{ github.ref_name }}
          cloud-url: gs://coopstools-homebrew-prj-pulumi-state
